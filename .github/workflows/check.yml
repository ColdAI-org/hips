# The generated README sections must match data/hips.json, and the sync script must run.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: README matches the index
        run: node scripts/sync.mjs --check
      - name: Every snapshot in the index exists
        run: |
          node -e '
            const fs = require("fs");
            const { records } = JSON.parse(fs.readFileSync("data/hips.json", "utf8"));
            const missing = records.filter(r => r.snapshot && !fs.existsSync(r.snapshot));
            if (missing.length) { console.error("missing:", missing.map(r => r.snapshot)); process.exit(1); }
            console.log(records.length + " records, all snapshots present");
          '
